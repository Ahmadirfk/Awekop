name: Periodic Sync Task

on:
  schedule:
    - cron: '0 * * * *' # اجرای دقیق هر یک ساعت
  workflow_dispatch: # امکان اجرای دستی برای تست

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run
        env:
          B_TK: ${{ secrets.B_TK }}
          B_CID: ${{ secrets.B_CID }}
          Z_PW: ${{ secrets.Z_PW }}
          DATA_SRC: ${{ secrets.DATA_SRC }}
        run: python engine.py
